        }
        tapStart = null;
        return;
      }
      // ペイントモードの「視点移動」ツール選択時はキャンバスに描画せず、通常通りカメラ操作を行わせる
      if (currentMode === 'scale' && (selectedCubeData || selectedBone) && resizeGizmoGroup.visible) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(resizeHandleMeshes, false);
        if (intersects.length > 0) {
          controls.enabled = false;
          activeResizeHandle = intersects[0].object.userData;
          activeResizeTargetIsBone = !selectedCubeData && !!selectedBone;
          saveState();
          if (activeResizeTargetIsBone) {
            const entry = boneGroupList.find(e => e.bone === selectedBone);
            activeResizeWorldObject = entry ? entry.group : null;
            boneResizeInitial = {
              bbox: getBoneBoundingBox(selectedBone),
              bonePivot: selectedBone.pivot ? [...selectedBone.pivot] : null,
              cubes: (selectedBone.cubes || []).map(c => ({
                cube: c,
                origin: [...(c.origin || [0, 0, 0])],
                size: [...(c.size || [1, 1, 1])],
                pivot: c.pivot ? [...c.pivot] : null
              }))
            };
          } else {
            activeResizeWorldObject = selectedCubeData.mesh;
            const { cube } = selectedCubeData;
            initialCubeOrigin = [...(cube.origin || [0, 0, 0])];
            initialCubeSize = [...(cube.size || [1, 1, 1])];
          }
          currentAppliedDelta = 0;
          const handleWorldPos = new THREE.Vector3();
          intersects[0].object.getWorldPosition(handleWorldPos);
          const camDir = new THREE.Vector3();
          camera.getWorldDirection(camDir);
          dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), handleWorldPos);
          raycaster.ray.intersectPlane(dragPlane, dragStartWorldPos);
          tapStart = null;
          return;
        }
      }
      tapStart = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('pointermove', (e) => {
      if (isPaintStroke) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const visibleCubes = cubeMeshList.filter(m => m.visible);
        const intersects = raycaster.intersectObjects(visibleCubes, false);
        if (intersects.length > 0) {
          applyPaintAtIntersection(intersects[0], false);
        } else {
          // カーソルがモデルから外れた場合、次に当たった時に離れた位置と誤って補間線を引かないようリセット
          lastPaintPixel = null;
        }
        return;
      }
      if (activeResizeHandle && activeResizeWorldObject) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const currentWorldPos = new THREE.Vector3();
        if (raycaster.ray.intersectPlane(dragPlane, currentWorldPos)) {
          const worldQuat = new THREE.Quaternion();
          activeResizeWorldObject.getWorldQuaternion(worldQuat);
          const worldAxis = activeResizeHandle.localAxis.clone().applyQuaternion(worldQuat).normalize();
          const deltaVec = currentWorldPos.clone().sub(dragStartWorldPos);
          const rawDelta = deltaVec.dot(worldAxis);
          const deltaInt = Math.round(rawDelta);
          if (deltaInt !== currentAppliedDelta) {
            currentAppliedDelta = deltaInt;
            if (activeResizeTargetIsBone) {
              applyResizeDeltaForBone(activeResizeHandle.dirName, deltaInt);
            } else {
              applyResizeDelta(activeResizeHandle.dirName, deltaInt);
            }
          }
        }
      }
    });
    window.addEventListener('pointerup', (e) => {
      if (isPaintStroke) {
        isPaintStroke = false;
        controls.enabled = true;
        tapStart = null;
        lastPaintPixel = null;
        updateTexturePreviewFromCanvas();
        return;
      }
      if (activeResizeHandle) {
        activeResizeHandle = null;
        activeResizeWorldObject = null;
        activeResizeTargetIsBone = false;
        boneResizeInitial = null;
        controls.enabled = true;
        parseBedrockJSON(rawModelJSON, false);
        return;
      }
      if (!tapStart) return;
      const start = tapStart;
      tapStart = null;
      if (recentlyDragged) { recentlyDragged = false; return; }
      if (e.target.closest(UI_EXCLUDE_SELECTOR)) return;
      const dx = e.clientX - start.x;
      const dy = e.clientY - start.y;
      if (Math.sqrt(dx * dx + dy * dy) > 8) return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const visibleCubes = cubeMeshList.filter(mesh => mesh.visible);
      const intersects = raycaster.intersectObjects(visibleCubes, false);
      if (intersects.length > 0) {
        selectCube(intersects[0].object);
      } else {
        deselectCube();
        selectedBone = null;
        buildCubeListUI();
      }
    });
    function applyResizeDelta(dirName, delta) {
      if (!selectedCubeData) return;
      const cube = selectedCubeData.cube;
      let newOrigin = [...initialCubeOrigin];
      let newSize = [...initialCubeSize];
      switch (dirName) {
        case '+X': {
          newSize[0] = Math.max(0, initialCubeSize[0] + delta);
          break;
        }
        case '-X': {
          let targetSize = initialCubeSize[0] + delta;
          if (targetSize < 0) targetSize = 0;
          let actualDelta = targetSize - initialCubeSize[0];
          newSize[0] = targetSize;
          newOrigin[0] = initialCubeOrigin[0] - actualDelta;
          break;
        }
        case '+Y': {
          newSize[1] = Math.max(0, initialCubeSize[1] + delta);
          break;
        }
        case '-Y': {
          let targetSize = initialCubeSize[1] + delta;
          if (targetSize < 0) targetSize = 0;
          let actualDelta = targetSize - initialCubeSize[1];
          newSize[1] = targetSize;
          newOrigin[1] = initialCubeOrigin[1] - actualDelta;
          break;
        }
        case '+Z': {
          newSize[2] = Math.max(0, initialCubeSize[2] + delta);
          break;
        }
        case '-Z': {
          let targetSize = initialCubeSize[2] + delta;
          if (targetSize < 0) targetSize = 0;
          let actualDelta = targetSize - initialCubeSize[2];
          newSize[2] = targetSize;
          newOrigin[2] = initialCubeOrigin[2] - actualDelta;
          break;
        }
      }
      cube.origin = newOrigin;
      cube.size = newSize;
      parseBedrockJSON(rawModelJSON, false);
      updateResizeGizmo();
      // parseBedrockJSONでCubeのTHREE.Meshが毎回新しいインスタンスに作り直されるため、
      // ドラッグ中に軸方向の計算に使っているactiveResizeWorldObjectを古い(既に外れた)参照のまま
      // 放置すると、以降のドラッグ計算がズレて時々位置がおかしくなるバグの原因になっていた。
      // 再構築後の新しいMeshへ参照を更新しておく。
      if (activeResizeWorldObject) {
        const refreshedMesh = cubeMeshList.find(m => m.userData.cube === cube);
        if (refreshedMesh) activeResizeWorldObject = refreshedMesh;
      }
    }
    const bottomPanel = document.getElementById('bottom-panel');
    const resizeHandle = document.getElementById('resize-handle');
    const modeSelector = document.querySelector('.mode-selector-vertical');
    const zoomContainer = document.querySelector('.zoom-btn-container');
    let isResizing = false, startY = 0, startHeight = 0;
    function startResize(e) {
      isResizing = true;
      const touch = e.touches ? e.touches[0] : e;
      startY = touch.clientY;
      startHeight = bottomPanel.offsetHeight;
      if (e.cancelable) e.preventDefault();
      window.addEventListener('mousemove', handleResize);
      window.addEventListener('mouseup', stopResize);
      window.addEventListener('touchmove', handleResize, { passive: false });
      window.addEventListener('touchend', stopResize);
    }
    function handleResize(e) {
      if (!isResizing) return;
      if (e.cancelable) e.preventDefault();
      const touch = e.touches ? e.touches[0] : e;
      if (!touch) return;
      const newHeight = startHeight + (startY - touch.clientY);
      const clampedHeight = Math.max(120, Math.min(newHeight, window.innerHeight * 0.8));
      bottomPanel.style.height = `${clampedHeight}px`;
      const newBottomPos = clampedHeight + 16;
      modeSelector.style.bottom = `${newBottomPos}px`;
      zoomContainer.style.bottom = `${newBottomPos}px`;
    }
    function stopResize() {
      isResizing = false;
      window.removeEventListener('mousemove', handleResize);
      window.removeEventListener('mouseup', stopResize);
      window.removeEventListener('touchmove', handleResize);
      window.removeEventListener('touchend', stopResize);
      redrawUVEditor();
    }
    resizeHandle.addEventListener('mousedown', startResize);
    resizeHandle.addEventListener('touchstart', startResize, { passive: false });
    // モデルのUV数値(cube.uv および 各面のuv/uv_size)を、texture_widthとtexture_heightの
    // 変化に合わせて比例スケーリングする。Bedrockの本来の仕様ではUVは
    // texture_width/heightを基準にした「割合」で解釈されるため、実際のテクスチャ画像を
    // 元の解像度の整数倍(2倍・4倍など、いわゆるHDテクスチャ)で読み込んだだけでは
    // 見た目上のズレは起きないはずだが、このツールは画像を毎回
    // 「その時点のtexture_width/height」へ強制的に縮小/拡大してから描き込んでいたため、
    // 例えば32×32宣言のモデルへ実寸64×64のPNGを読み込むと、画像がぼやけて縮小され
    // 「違う画像に変わったように見える」不具合になっていた。
    // ここでは画像を縮小せず実寸のまま読み込み、代わりにモデル側のUV数値と
    // texture_width/heightを画像の実寸に合わせて再スケーリングすることで、
    // 劣化なくどちらの解像度のテクスチャも正しく扱えるようにする。
    function rescaleModelUVsToTexture(geometry, newW, newH) {
      if (!geometry) return false;
      if (!geometry.description) geometry.description = {};
      const desc = geometry.description;
      const oldW = desc.texture_width || newW;
      const oldH = desc.texture_height || newH;
      const sx = newW / oldW, sy = newH / oldH;
      const changed = (sx !== 1 || sy !== 1);
      if (changed) {
        (geometry.bones || []).forEach(bone => {
          (bone.cubes || []).forEach(cube => {
            if (!cube.uv) return;
            if (Array.isArray(cube.uv)) {
              cube.uv = [(cube.uv[0] || 0) * sx, (cube.uv[1] || 0) * sy];
            } else {
              Object.keys(cube.uv).forEach(faceKey => {
                const f = cube.uv[faceKey];
                if (!f) return;
                if (Array.isArray(f.uv)) f.uv = [(f.uv[0] || 0) * sx, (f.uv[1] || 0) * sy];
                if (Array.isArray(f.uv_size)) f.uv_size = [(f.uv_size[0] || 0) * sx, (f.uv_size[1] || 0) * sy];
              });
            }
          });
        });
      }
      desc.texture_width = newW;
      desc.texture_height = newH;
      return changed;
    }
    function readTexture(file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        const dataUrl = evt.target.result;
        // まず画像の実寸(naturalWidth/naturalHeight)を調べてから、その実寸をそのまま
        // ペイントキャンバスの解像度として使う(宣言サイズへ無理に縮小/拡大しない)
        const probe = new Image();
        probe.onload = () => {
          const naturalW = probe.naturalWidth || probe.width || 64;
          const naturalH = probe.naturalHeight || probe.height || 64;
          const geometry = getActiveGeometry();
          if (geometry) {
            const declaredW = (geometry.description && geometry.description.texture_width) || naturalW;
            const declaredH = (geometry.description && geometry.description.texture_height) || naturalH;
            if (declaredW !== naturalW || declaredH !== naturalH) {
              saveState();
              rescaleModelUVsToTexture(geometry, naturalW, naturalH);
              showError(`テクスチャの解像度(${naturalW}x${naturalH})に合わせてUVを再スケーリングしました。`);
            }
          }
          loadImageIntoPaintCanvas(dataUrl, naturalW, naturalH, () => {
            if (rawModelJSON) parseBedrockJSON(rawModelJSON, false);
            updateTexturePreviewFromCanvas();
          });
        };
        probe.src = dataUrl;
      };
      reader.readAsDataURL(file);
    }
    // 既にモデルが読み込まれている場合、新しく読み込むJSONのBone/Cubeを既存モデルへ追加する(既存Cubeを維持する)
    function importModelKeepingExisting(loadedJson) {
      let loadedGeo = null;
      if (loadedJson["minecraft:geometry"]) loadedGeo = loadedJson["minecraft:geometry"][0];
      else {
        const keys = Object.keys(loadedJson).filter(k => k.startsWith("geometry."));
        if (keys.length > 0) loadedGeo = loadedJson[keys[0]];
      }
      if (!loadedGeo) {
        showError("有効なBedrock Geometry JSONではありません。");
        return;
      }
      if (!rawModelJSON) {
        parseBedrockJSON(loadedJson, true);
        return;
      }
      saveState();
      let geometry = getActiveGeometry();
      if (!geometry) { parseBedrockJSON(loadedJson, true); return; }
      if (!geometry.bones) geometry.bones = [];
      const loadedBones = (loadedGeo.bones || []).map(b => JSON.parse(JSON.stringify(b)));
      const nameMap = new Map();
      loadedBones.forEach(b => {
        const orig = b.name || 'bone';
        const unique = getUniqueBoneName(orig, geometry);
        nameMap.set(orig, unique);
        b.name = unique;
        b._collapsed = false;
        geometry.bones.push(b);
      });
      loadedBones.forEach(b => {
        if (b.parent && nameMap.has(b.parent)) b.parent = nameMap.get(b.parent);
      });
      parseBedrockJSON(rawModelJSON, false);
      focusOnModel();
    }
    // モデル読み込み時、既にモデルがあれば「既存モデルを維持するか」を3択で確認する。
    // 「はい」= 既存モデルを維持したまま、読み込んだJSONを追加インポートする(importModelKeepingExisting)。
    // 「いいえ」= 既存モデルを破棄して、読み込んだJSONだけの新規モデルに置き換える。
    // 「キャンセル」= 何もせず読み込み自体を中止する(以前は誤って「いいえ」と同じ破棄動作になっていた)。
    async function loadModelJSONWithPrompt(loadedJson) {
      let loadedGeo = null;
      if (loadedJson["minecraft:geometry"]) loadedGeo = loadedJson["minecraft:geometry"][0];
      else {
        const keys = Object.keys(loadedJson).filter(k => k.startsWith("geometry."));
        if (keys.length > 0) loadedGeo = loadedJson[keys[0]];
      }
      if (!loadedGeo) {
        showError("有効なBedrock Geometry JSONではありません。");
        return;
      }
      if (!rawModelJSON) {
        parseBedrockJSON(loadedJson, true);
        return;
      }
      const choice = await showThreeWayModal({
        message: "既存のモデルを維持しますか？\n\n「はい」: 既存モデルを維持したまま追加で読み込みます\n「いいえ」: 既存モデルを破棄して読み込んだモデルに置き換えます\n「キャンセル」: 読み込みをやめます"
      });
      if (choice === 'yes') {
        importModelKeepingExisting(loadedJson);
      } else if (choice === 'no') {
        saveState();
        parseBedrockJSON(loadedJson, true);
      }
      // choice === 'cancel' の場合は何もしない(読み込み自体を中止)
    }
    document.getElementById('json-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          try { loadModelJSONWithPrompt(JSON.parse(evt.target.result)); }
          catch(err) { showError("JSONファイルの解析に失敗しました。"); }
        };
        reader.readAsText(file);
      }
      e.target.value = '';
    });
    document.getElementById('texture-input').addEventListener('change', (e) => {
      if (e.target.files[0]) readTexture(e.target.files[0]);
      e.target.value = '';
    });
    document.getElementById('btn-export').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!rawModelJSON) {
        showError("エクスポートするモデルがありません。");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(rawModelJSON, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "model.geo.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });
    document.getElementById('btn-export-texture').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!paintTexture) {
        showError("エクスポートするテクスチャがありません。");
        return;
      }
      const dataUrl = paintCanvas.toDataURL('image/png');
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute('href', dataUrl);
      downloadAnchor.setAttribute('download', 'texture.png');
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });
    function focusOnModel() {
      const box = new THREE.Box3().setFromObject(currentModelGroup);
      if (box.isEmpty()) return;
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = camera.fov * (Math.PI / 180);
      let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2.2;
      camera.position.set(center.x + cameraZ * 0.4, center.y + cameraZ * 0.4, center.z + cameraZ);
      controls.target.copy(center);
      controls.update();
    }
    document.getElementById('btn-focus').addEventListener('click', (e) => {
      e.stopPropagation();
      focusOnModel();
    });
    const dropZone = document.getElementById('drop-zone');
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (e.dataTransfer && e.dataTransfer.types && Array.from(e.dataTransfer.types).includes('Files')) {
        dropZone.classList.add('active');
      }
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('active');
      if (e.dataTransfer && e.dataTransfer.files.length > 0) {
        Array.from(e.dataTransfer.files).forEach(file => {
          if (file.name.endsWith('.json')) {
            const reader = new FileReader();
            reader.onload = evt => {
              try { loadModelJSONWithPrompt(JSON.parse(evt.target.result)); }
              catch(err) { showError("JSONファイルの解析に失敗しました。"); }
            };
            reader.readAsText(file);
          } else if (file.name.endsWith('.png')) {
            readTexture(file);
          }
        });
      }
    });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      redrawUVEditor();
    });
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      updateResizeGizmoAutoScale();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
